services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.4}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13031}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: sqlExpressions
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      prometheus-fixture:
        condition: service_started
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: sqlexprtest
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: sqlexprtest
    volumes:
      - ./postgres.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlexprtest"]
      interval: 1s
      timeout: 3s
      retries: 30
  prometheus-fixture:
    image: python:3.13.1-alpine3.21
    command: ["python", "/fixture/prometheus.py"]
    volumes:
      - ./prometheus.py:/fixture/prometheus.py:ro
