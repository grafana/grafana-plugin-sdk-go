# Copy into .github/workflows after adapting paths and the version matrix.
name: SQL Expressions compatibility
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -race ./experimental/sqlexprtest/...
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grafana: ['13.1.8', '13.2.4']
    env:
      GRAFANA_VERSION: ${{ matrix.grafana }}
      SQLEXPRTEST_GRAFANA_VERSION: ${{ matrix.grafana }}
      SQLEXPRTEST_GRAFANA_URL: http://127.0.0.1:13031
      SQLEXPRTEST_PILOTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: docker compose -p sqlexprtest -f experimental/sqlexprtest/examples/compose.yaml up -d --wait
      - run: go test ./experimental/sqlexprtest/grafanatest/ ./experimental/sqlexprtest/examples/ -v -count=1
      - if: always()
        run: docker compose -p sqlexprtest -f experimental/sqlexprtest/examples/compose.yaml down --volumes
